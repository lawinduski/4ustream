<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4uStream — Login</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.svg">
<meta name="theme-color" content="#0b1020">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="stylesheet" href="/css/style.css?v=2026.09.17-1">
</head>
<body>
<div id="app-header"></div>
<main class="container">
  <div class="max-w-md glass rounded-3xl auth-card">
    <div class="auth-icon" id="auth-icon"></div>
    <h1 class="mt-6" style="font-size:1.8rem;font-weight:1000">Welcome back</h1>
    <p class="mt-1" style="color:#94a3b8">Sign in to continue to 4uStream.</p>
    <form id="login-form" class="mt-7 space-y-4">
      <input required type="email" id="email" placeholder="Email" class="input">
      <input required type="password" id="password" placeholder="Password" class="input">
      <div id="error" class="error-text hidden"></div>
      <button id="submit-btn" class="btn-primary" type="submit"><span id="submit-icon"></span>Sign in</button>
    </form>
    <button id="forgot-btn" class="mt-4 link-accent" style="background:none;border:0;font-size:12px;cursor:pointer">Forgot password?</button>
    <p class="mt-6" style="font-size:13px;color:#64748b">New here? <a class="link-accent" href="/signup.html">Create an account</a></p>
  </div>
</main>
<div id="app-footer"></div>
<script type="module" src="/js/pages/login.js?v=2026.09.17-1"></script>
</body>
</html>
