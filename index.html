<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4uStream</title>
<meta name="description" content="Modern live TV, films and drama platform">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.svg">
<link rel="apple-touch-icon" href="/icons/icon-192.svg">
<meta name="theme-color" content="#0b1020">
<link rel="preconnect" href="https://www.gstatic.com">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app-header"></div>
<main class="container">
  <div id="home-stage" class="home-stage fade-up">
    <div id="ad-slot"></div>

    <section class="hero-premium">
      <div class="hero-grid"></div>
      <div class="hero-glow hero-glow-a"></div>
      <div class="hero-glow hero-glow-b"></div>
      <div class="hero-body">
        <div class="eyebrow"><span class="live-dot"></span> 4uStream • BADINI FIRST</div>
        <h1 class="hero-title" data-t="welcome"></h1>
        <p class="hero-copy" data-t="subtitle"></p>
        <div class="flex flex-wrap gap-3 mt-8">
          <a href="/live.html" class="primary-cta"><span id="hero-play"></span><span data-t="live"></span></a>
          <a id="hero-secondary" href="/signup.html" class="secondary-cta"><span data-t="signup"></span></a>
        </div>
        <div class="hero-metrics">
          <span id="m-zap"></span><span id="m-shield"></span><span id="m-phone"></span>
        </div>
      </div>
    </section>

    <div class="quick-grid">
      <a href="/live.html" class="quick-card"><span class="quick-icon" id="q-live"></span><div><b data-t="live"></b><small>Live channels</small></div></a>
      <a href="/films.html" class="quick-card"><span class="quick-icon" id="q-films"></span><div><b data-t="films"></b><small>Free &amp; VIP films</small></div></a>
      <a href="/drama.html" class="quick-card"><span class="quick-icon" id="q-drama"></span><div><b data-t="drama"></b><small>Seasons &amp; episodes</small></div></a>
      <a href="/account.html" class="quick-card"><span class="quick-icon" id="q-vip"></span><div><b>VIP</b><small id="q-vip-text">Explore VIP</small></div></a>
    </div>

    <section class="premium-section hidden" id="section-live">
      <div class="section-heading"><div><div class="section-kicker">4uSTREAM</div><h2 data-t="live"></h2></div><a href="/live.html">View all <span id="cl-live"></span></a></div>
      <div class="grid grid-2 sm:grid-3 lg:grid-4 gap-4" id="live-grid"></div>
    </section>

    <section class="premium-section hidden" id="section-films">
      <div class="section-heading"><div><div class="section-kicker">4uSTREAM</div><h2 data-t="films"></h2></div><a href="/films.html">View all <span id="cl-films"></span></a></div>
      <div class="grid grid-2 sm:grid-4 lg:grid-5 gap-4" id="films-grid"></div>
    </section>

    <section class="premium-section hidden" id="section-drama">
      <div class="section-heading"><div><div class="section-kicker">4uSTREAM</div><h2 data-t="drama"></h2></div><a href="/drama.html">View all <span id="cl-drama"></span></a></div>
      <div class="grid grid-2 sm:grid-4 lg:grid-5 gap-4" id="drama-grid"></div>
    </section>
  </div>
</main>
<div id="app-footer"></div>
<script type="module" src="/js/pages/home.js"></script>
</body>
</html>
