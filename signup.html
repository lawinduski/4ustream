<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4uStream — Sign up</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.svg">
<meta name="theme-color" content="#0b1020">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app-header"></div>
<main class="container">
  <div class="max-w-md glass rounded-3xl auth-card">
    <div class="auth-icon" id="auth-icon"></div>
    <h1 class="mt-6" style="font-size:1.8rem;font-weight:1000">Create account</h1>
    <p class="mt-1" style="color:#94a3b8">Your account starts as pending until an admin activates it.</p>
    <form id="signup-form" class="mt-7 space-y-4">
      <input required id="name" placeholder="Full name" class="input">
      <input required type="email" id="email" placeholder="Email" class="input">
      <input required minlength="8" type="password" id="password" placeholder="Password (8+ characters)" class="input">
      <div id="error" class="error-text hidden"></div>
      <button id="submit-btn" class="btn-primary" type="submit"><span id="submit-icon"></span>Create account</button>
    </form>
    <p class="mt-6" style="font-size:13px;color:#64748b">Already registered? <a class="link-accent" href="/login.html">Sign in</a></p>
  </div>
</main>
<div id="app-footer"></div>
<script type="module" src="/js/pages/signup.js"></script>
</body>
</html>
